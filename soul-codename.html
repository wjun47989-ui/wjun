<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>测测你的灵魂代号</title><style>
:root{--bg:#f5f5f2;--paper:#fff;--ink:#202320;--muted:#777d77;--line:#dedfd9;--accent:#687c70;--soft:#edf0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;min-height:100vh}main{max-width:800px;margin:auto;padding:28px 20px 60px}.card{background:var(--paper);border:1px solid var(--line);padding:clamp(24px,6vw,60px);box-shadow:0 18px 60px #2633290b;position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:250px;height:250px;border:1px solid #e9ebe6;border-radius:50%;right:-115px;top:-135px}.hero{text-align:center;min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font:11px/1.7 sans-serif;letter-spacing:.28em;color:var(--accent)}h1{font-size:clamp(36px,7vw,58px);line-height:1.4;margin:24px 0;letter-spacing:.08em}.hero p{color:var(--muted);line-height:1.9;margin:5px}.motif{font-size:28px;color:#9aa99d;letter-spacing:.5em;margin:12px}.btn{position:relative;z-index:1;background:var(--ink);color:white;border:1px solid var(--ink);padding:14px 26px;font:inherit;letter-spacing:.12em;cursor:pointer;transition:.2s}.btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}.hide{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:13px sans-serif}.progress{height:3px;background:#e7e9e4;margin:23px 0 34px}.progress i{height:100%;display:block;background:var(--accent);transition:width .4s}.qtitle{font-size:clamp(22px,4vw,29px);line-height:1.65;margin:0 0 26px}.options{display:grid;gap:12px}.option{position:relative;z-index:1;background:#fff;border:1px solid var(--line);padding:16px;text-align:left;font:16px/1.6 inherit;color:var(--ink);cursor:pointer;transition:.2s}.option:hover,.option.selected{border-color:var(--accent);background:var(--soft)}.option.selected{box-shadow:inset 4px 0 var(--accent)}.option b{color:var(--accent);margin-right:10px}.nav{margin-top:24px}.result{text-align:center}.sigil{margin:24px auto;width:82px;height:82px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:25px;transform:rotate(45deg)}.sigil span{transform:rotate(-45deg)}.result h2{font-size:clamp(32px,6vw,48px);margin:12px 0}.type{font:14px sans-serif;letter-spacing:.2em;color:var(--accent)}.verse{font-size:20px;line-height:1.7;padding:20px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0}.details{text-align:left;display:grid;gap:12px;margin:24px 0}.details article{padding:14px 16px;background:#f8f9f6;border-left:2px solid #91a194;line-height:1.85}.details b{color:var(--accent)}.details p{margin:6px 0 0;color:#59615a}.note{font:12px/1.8 sans-serif;color:#90958f}.actions{position:relative;z-index:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.secondary{background:white;color:var(--ink)}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.enter{animation:enter .32s ease}@media(max-width:550px){main{padding:12px}.hero{min-height:calc(100svh - 48px)}.card{padding:26px 22px}.option{padding:14px}.qtitle{margin-bottom:20px}}
</style></head><body><main>
<section class="card hero" id="home"><div class="eyebrow">一场关于内在秩序的轻量漫游</div><div class="motif">◌　✳　◌</div><h1>测测你的<br>灵魂代号</h1><p>15道日常选择题，循着你的偏好寻找人格意象</p><p class="note">约 2 分钟 · 纯属趣味探索，不是考试或专业心理诊断</p><div class="motif">—　✦　—</div><button class="btn" onclick="start()">开启探索　→</button></section>
<section class="card hide" id="quiz"><div class="head"><span class="eyebrow">INNER CODE / 自我观察</span><span id="count"></span></div><div class="progress"><i id="bar"></i></div><h2 class="qtitle" id="question"></h2><div class="options" id="options"></div><div class="nav"><button class="btn secondary" id="prev" onclick="previous()">← 上一题</button></div></section>
<section class="card result hide" id="result"></section></main><script>
const profiles={INTJ:['雾中筑塔者','于无人的虚境绘制脉络，在混沌里推演秩序。偏爱万物底层的骨架，鲜少沉溺浮于表面的情绪。迷雾是你的底色，你独自搭建属于逻辑的高塔。','你善于看见结构、推演可能，并以独立判断整理复杂问题。','答案常呈现内倾、直觉、逻辑和计划倾向。','把远见变成路线图的能力。','先搭好塔，再记得开窗看看同行的人。','迷雾散尽前，你已为明日画好边界。'],INTP:['星海拾思者','漂浮在无边思绪的云海，收集转瞬即逝的念头碎片。抗拒固化定论，乐于无限拆解、反问、假设。世界是一场永不停歇的思维游戏，落地从来不是优先选项。','你好奇、爱追问，喜欢从不同角度拆解概念，不急着接受现成结论。','你偏好独立思考、探索可能，并保留灵活空间。','发现隐藏联系与提出新问题的能力。','给灵感配个小小的“落地清单”，星星就能变成坐标。','念头如星，追问让夜空有了形状。'],INFJ:['深林引灯人','密林深处一盏长明微光，悄悄读懂旁人藏起来的褶皱心绪。心里守着一份安静的信条，不喧哗、不辩解，缓慢前行。习惯独自容纳众多情绪，很少向外摊开自己的疲惫。','你擅长体察情绪，也会从细节中寻找更深的意义，内心有稳定的价值方向。','你常把理解他人、长远愿景和内在信念放在重要位置。','安静共情并看见趋势的能力。','记得把灯也转向自己：说出需要，不必总做那个承接的人。','你不必声张，微光也能照见方向。'],INFP:['原野寻星者','守着一片独属于自己的精神旷野，感知柔软且绵长。忠于本心的浪漫，抵触粗糙功利的世俗规则。灵魂揣着星光，现实锋利的棱角总能轻易划伤你。','你珍视真诚和意义，感受细腻，愿意按内心认同的方式生活。','你的选择偏向理想、共情和开放探索。','守住初心并创造独特表达的能力。','为梦想留一条现实小路，温柔也能走得很远。','心里的星光，指向你愿意成为的自己。'],ISTJ:['磐石刻痕者','以过往验证的痕迹为标尺，信赖确凿、可触摸的真实。循轨迹稳步向前，恪守约定与秩序，厌恶突如其来的变数。扎根于既定的现实，很难共情脱离实感的空想。','你重视可靠、事实与承诺，擅长把事情按步骤稳稳推进。','你偏好具体信息、清晰标准和有序安排。','把承诺转化为稳定成果的能力。','给计划留一点弹性，变化有时也是新证据。','每一道刻痕，都在证明你走过的路。'],ISTP:['掌刃匠人','手握工具，拆解眼前一切具象事物。偏爱临场摸索，在实操里寻找答案，不爱空谈宏大道理。随性游走，不擅长漫长规划，情绪习惯向内缄默。','你倾向亲手试、现场看，再根据真实反馈调整方法。','你偏好独立、务实、灵活地解决眼前问题。','冷静排障与快速上手的能力。','偶尔提前说一声你的想法，沉默的高手也值得被读懂。','答案不在远处，在你动手的那一刻。'],ISFJ:['暖炉守夜人','如同老式壁炉，恒温、静默，默默承接周遭细碎需求。熟记身边人的喜好，把照料当成本能，安稳可靠。永远优先托住别人，常常忘了给自己划定边界。','你细心体贴，记得具体的人和事，也重视关系中的稳定与照顾。','你的偏好偏向具体关怀、共情和可靠的日常节奏。','让人安心、把关怀落实到细节的能力。','照顾别人之前，也给自己的炉火添些柴。','你守着温度，也值得被温柔照看。'],ISFP:['山隅生花者','山野一隅悄然舒展的花，捕捉触感、光影、当下的诗意。活在瞬时的体验之中，排斥说教、束缚与强行安排。柔软避冲突，重压来临便悄悄退到安静角落。','你重视真实感受和当下体验，不喜欢被僵硬规则或过度安排束缚。','你倾向内敛、务实、温和与灵活。','审美敏锐、尊重个体感受。','不舒服时试着说出界限，柔软不等于只能退让。','不争喧哗，也能把一隅活成风景。'],ENTJ:['旷野执旗者','旷野之上持旗引路，一眼看穿纷乱里的方向。擅长统筹、推动、收拢散落的事务，目标感滚烫。奔赴前路时，容易忽略沿途旁人细微的情绪起伏。','你目标明确，喜欢组织资源、推动决策并解决复杂难题。','你偏向外向行动、长线判断、理性决策和结构化推进。','把想法变成团队行动的能力。','问一句“大家跟得上吗”，能让队伍走得更齐。','方向已明，旗帜为同行者而举。'],ENTP:['风口辩影者','乘着风与不同观点碰撞，以思辨为乐趣。热衷于打破固有框架，即兴生发无数新奇想法。厌倦重复沉闷，热情常常随新鲜感一同消散。','你享受观点碰撞，能迅速发现另一种可能，善于用新点子打破僵局。','你偏好探索、辩析、理性判断和保持开放。','创新联想与临场应变的能力。','为最喜欢的点子设一个收尾节点，让新鲜感长出成果。','风从问题间穿过，带来了新的门。'],ENFJ:['风中信使','捕捉群体流动的情绪，愿意点燃他人、陪伴成长。怀揣温热理想，擅长接住别人的迷茫，给予鼓励。被他人期待裹挟，持续消耗自己，忘了停下来喘息。','你善于连接人、传递鼓励，也会关注群体如何共同成长。','你倾向外向共情、寻找意义并主动组织行动。','凝聚人心、帮助他人看见潜能的能力。','你不必回应所有期待，休息也是关系的一部分。','风把心意送远，也请留一点给自己。'],ENFP:['晚风逐梦者','追逐流动的晚风，永远对未知抱有滚烫好奇。灵感源源不断，感染力向外漫开，热爱所有可能性。享受开局的热烈，很难长久耐住枯燥重复的过程。','你热情开放，对新鲜可能充满好奇，也容易点亮周围气氛。','你的答案倾向外向、想象、价值感和灵活探索。','激发灵感、连接不同的人与想法。','挑一个最想完成的可能，给它一段不被新点子打断的时间。','晚风不停，你可以选择一颗星先抵达。'],ESTJ:['墟市主事者','热闹市集里维持秩序的人，擅长梳理落地现实琐事。看重效率、条理与共识，把事务安排得井井有条。接纳实在可见的成果，对缥缈无据的幻想难以认同。','你擅长建立秩序、明确分工，让现实事务可靠落地。','你偏向外向执行、关注事实、按逻辑和规则推进。','管理复杂流程、推动执行的能力。','给试验和想象留一小块摊位，也许会遇见新机会。','市声纷杂，你总能把事情安排妥当。'],ESTP:['浪尖冲浪者','踏在翻涌浪尖，顺势感受当下的刺激与鲜活。应变敏锐，擅长就地解决眼前冒出的麻烦。目光容易被即时乐趣吸引，很少眺望遥远以后。','你反应敏捷，敢于尝试，擅长在变化现场找到可行办法。','你的偏好更务实、行动导向、灵活并关注当下。','临场决断和把握机会的能力。','偶尔望一眼远处的浪向，下一次出发会更从容。','浪尖之上，你用行动回答此刻。'],ESFJ:['宴席东道主','宴席上维系暖意的主人，用心维系人与人之间的联结。留心在场每个人的感受，努力让氛围和睦融洽。十分在意外界评价，惧怕矛盾、害怕被人厌弃。','你重视人际联结，乐于照顾氛围，让每个人感受到参与和欢迎。','你倾向外向、具体、体贴并重视共识。','营造归属感、维护关系网络的能力。','意见不同并不等于不被喜欢，真实表达也是一种亲近。','每个人都被照顾到时，席间便有了光。'],ESFP:['光斑表演者','落在舞台的明亮光斑，鲜活热烈，传递即刻快乐。沉浸当下的欢愉，擅长把轻松带给身边所有人。回避沉重、冗长的思索，不愿直面遥远难题。','你热烈鲜活，乐于体验当下，也擅长让身边的人轻松起来。','你偏好外向互动、现实体验、情感连接和灵活生活。','感染气氛、让生活更有滋味的能力。','给重要难题一个短短的面对时段，快乐会更踏实。','光斑落下的地方，平凡也会开始发亮。']};
// 15题轮流采样4个偏好轴。选项0代表左侧偏好，选项1代表右侧偏好。
const qs=[
['忙完一天后，你更想怎样恢复能量？',[['一个人安静待会儿','I'],['约朋友聊聊今天','E'],['做熟悉的小事让自己放松','S'],['找点新鲜有趣的体验','N']]],
['接到一项新任务，你先关注？',[['自己先理清思路再开工','I'],['找人讨论、边说边梳理','E'],['确认步骤、要求和已有资料','S'],['想想目标背后的可能性','N']]],
['朋友来问你建议，你通常先？',[['独立分析问题核心','I'],['通过交流一起理清头绪','E'],['根据具体事实给出办法','S'],['提出几种不同的可能方向','N']]],
['安排周末时，你更喜欢？',[['留一段独处充电时间','I'],['约人见面共享时光','E'],['安排熟悉、靠谱的活动','S'],['尝试没体验过的新计划','N']]],
['参加聚会时，你通常？',[['和熟人深入聊一会儿','I'],['主动认识新朋友','E'],['留意现场细节和实际安排','S'],['喜欢聊想法、假设和未来','N']]],
['遇到突发问题，你更先做什么？',[['安静观察，先想清楚','I'],['找相关的人快速沟通','E'],['核对眼前事实和已知信息','S'],['推演事情可能的发展方向','N']]],
['学习新东西时，你更偏好？',[['自己看资料慢慢琢磨','I'],['和别人讨论着学','E'],['看示范并按步骤练习','S'],['先理解原理，再自由探索','N']]],
['做重要选择时，你更看重？',[['保留独立判断的空间','I'],['听取身边人的观点','E'],['可靠证据与实际影响','S'],['长远愿景和隐藏可能','N']]],
['朋友情绪低落，你第一反应？',[['先陪对方安静一会儿','I'],['主动聊聊，帮对方打开话题','E'],['询问具体发生了什么','S'],['试着理解情绪背后的意义','N']]],
['意见不一致时，你更倾向？',[['先想清楚自己的立场','I'],['把分歧拿出来交流','E'],['回到事实和具体例子','S'],['寻找新的解释或折中可能','N']]],
['做决定时，你更依靠？',[['冷静分析利弊','T'],['确认是否符合自己的价值','F'],['验证过的经验和实际信息','S'],['直觉捕捉到的整体趋势','N']]],
['团队意见不一致时，你会？',[['指出逻辑和一致标准','T'],['先照顾感受、寻找共识','F'],['讨论现实条件和执行细节','S'],['提出跳出框架的新方案','N']]],
['安排一次短途旅行，你更喜欢？',[['提前订好时间和路线','J'],['保留弹性，随时调整','P'],['优先确认交通住宿等细节','S'],['先选一个有想象力的目的地','N']]],
['面对临时变化，你通常？',[['尽快重新排好计划','J'],['顺势而为，边走边看','P'],['先处理眼前最实际的问题','S'],['把变化当成新的可能性','N']]],
['完成任务时，你更安心于？',[['按节点推进，提前收尾','J'],['保留空间，灵活安排节奏','P'],['按清楚的步骤逐项完成','S'],['边做边尝试新的思路','N']]]
];
const home=document.getElementById('home'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),count=document.getElementById('count'),bar=document.getElementById('bar'),question=document.getElementById('question'),options=document.getElementById('options'),prev=document.getElementById('prev');let idx=0,answers=[];
function start(){idx=0;answers=Array(15).fill(null);home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}
function render(){count.textContent=`${idx+1} / 15`;bar.style.width=`${idx/15*100}%`;question.textContent=qs[idx][0];options.replaceChildren();qs[idx][1].forEach(([txt],j)=>{let b=document.createElement('button');b.className='option enter'+(answers[idx]===j?' selected':'');b.innerHTML=`<b>${'ABCD'[j]}</b>${txt}`;b.onclick=()=>{answers[idx]=j;if(idx<14){idx++;render()}else finish()};options.appendChild(b)});prev.disabled=idx===0}
function previous(){if(idx>0){idx--;render()}}
function finish(){let axes={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};qs.forEach((q,i)=>axes[q[1][answers[i]][1]]++);let code=(axes.E>axes.I?'E':'I')+(axes.S>axes.N?'S':'N')+(axes.T>axes.F?'T':'F')+(axes.J>axes.P?'J':'P');let p=profiles[code];quiz.classList.add('hide');result.innerHTML=`<div class="eyebrow">你的灵魂代号 · PERSONAL CODE</div><div class="sigil"><span>${code.slice(0,2)}</span></div><div class="type">${code}</div><h2>${p[0]}</h2><div class="verse">${p[1]}</div><div class="details"><article><b>性格特点</b><p>${p[2]}</p></article><article><b>匹配理由</b><p>15道生活选择中，你的偏好组合更接近 ${code}：${p[3]}</p></article><article><b>隐藏优势</b><p>${p[4]}</p></article><article><b>趣味彩蛋</b><p>${p[5]}</p></article><article><b>专属文案</b><p>「${p[6]}」</p></article></div><p class="note">这是一份趣味自我观察，不是专业心理诊断。人格类型只是理解自己的一个轻巧视角。</p><div class="actions"><button class="btn" onclick="start()">重新探索　↻</button><button class="btn secondary" onclick="share()">分享代号　↗</button></div>`;result.classList.remove('hide');result.classList.add('enter');bar.style.width='100%'}
async function share(){let title=`我的灵魂代号是${result.querySelector('h2').textContent}｜${result.querySelector('.type').textContent}`;try{if(navigator.share)await navigator.share({title,text:`${title}\n${result.querySelector('.verse').textContent}`,url:location.href});else{await navigator.clipboard.writeText(`${title}\n${result.querySelector('.verse').textContent}\n${location.href}`);alert('结果文案已复制，可以分享啦！')}}catch(e){}}
</script></body></html>
