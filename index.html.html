</style><main><section id="home" class="card hero"><div class="eyebrow">一场关于你的东方性格漫游</div><h1>测测你的灵魂<br>对应哪位中国历史人物</h1><p>40道生活选择题 · 不考典故，只看你的行事风格</p><p class="muted">约 3 分钟｜趣味人格测试，不是心理诊断</p><button class="btn" onclick="start()">开始探寻　→</button></section><section id="quiz" class="card hide"><div class="eyebrow">性格漫游　·　<span id="count"></span></div><div class="progress"><i id="bar"></i></div><h2 class="qtitle" id="question"></h2><div id="options"></div></section><section id="result" class="card result hide"></section></main><script>

const archetypes=[{name:'诸葛亮',role:'谋士',desc:'善于观察全局，能把复杂局面拆解成一步步可行的策略。你稳、细、讲究准备，也愿意为重要的人和目标投入心力。',reason:'你的选择多次表现出规划意识、逻辑判断与长线思维。',adv:'强大的系统化能力，能在混乱里找到秩序。',egg:'你的随身物品里，可能藏着一份别人不知道的备用方案。',line:'风起之前，你已经看见了风的方向。',tag:'运筹帷幄'}, {name:'李世民',role:'帝王',desc:'目标感强，敢于承担，也懂得借助伙伴的力量。你不只想赢，更希望把事情带到更大的局面。',reason:'你常选择主动决断、整合资源和推动团队向前。',adv:'关键时刻敢担责，也能让人愿意跟随。',egg:'你可能有个“如果让我来做，我会这样改”的小本本。',line:'心有山河，脚下自有万里。',tag:'胸有丘壑'}, {name:'苏轼',role:'文人诗人',desc:'感受力丰沛，既能认真生活，也能在变化中找到乐趣。你愿意表达、连接，也擅长把寻常日子过出滋味。',reason:'你重视情感、体验与分享，在关系和兴趣中获得能量。',adv:'把低潮转化为幽默和创造力。',egg:'你适合拥有一间茶香、书页和零食都齐全的房间。',line:'把日子过成诗，也把风雨过成故事。',tag:'旷达有趣'}, {name:'李白',role:'诗人侠客',desc:'自由、热烈，愿意拥抱未知。你不喜欢被单一标签限制，灵感和好奇心常带你去意想不到的地方。',reason:'你倾向探索、即兴和打破常规，重视真实体验。',adv:'敢于开启新路，能为生活带来鲜活能量。',egg:'你可能会为了一个好看的日落，临时改掉整天计划。',line:'天地很大，何必把自己活成一条直线。',tag:'仗剑天涯'}, {name:'岳飞',role:'将领',desc:'有责任感、有执行力，认定方向后便稳步向前。你保护自己珍惜的人，也希望努力真正带来改变。',reason:'你重视行动、承诺和关键时刻的担当。',adv:'压力下仍能保持韧性，给团队带来安全感。',egg:'你口头说“都可以”，心里其实已经排好了优先级。',line:'心中有要守护的事，脚步便不会轻。',tag:'忠勇坚毅'}, {name:'陶渊明',role:'隐士',desc:'内心有自己的尺度，懂得在热闹之外保留空间。你看重真诚和自在，不会为了迎合所有人而丢掉节奏。',reason:'你的答案常指向独处、自然、内心感受与自主选择。',adv:'不被外界节奏裹挟，能恢复专注与平静。',egg:'你最理想的社交局，也许是三五好友加一顿好饭。',line:'心有桃源，何处不是归处。',tag:'自在清醒'}];
const keys=['谋士','帝王','文人诗人','诗人侠客','将领','隐士'];let n=0,scores=[0,0,0,0,0,0];function start(){n=0;scores.fill(0);home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');show()}function show(){count.textContent=`${n+1} / 40`;bar.style.width=`${n/40*100}%`;question.textContent=qs[n][0];options.innerHTML='';qs[n][1].forEach((x,i)=>{let b=document.createElement('button');b.className='option fade';b.textContent=`${'甲乙丙丁'[i]}　${x}`;b.onclick=()=>{scores[i]++;n++;n<40?show():finish()};options.append(b)})}function finish(){quiz.classList.add('hide');let ix=scores.indexOf(Math.max(...scores)),a=archetypes[ix];result.classList.remove('hide');result.innerHTML=`<div class="eyebrow">你的灵魂画像 · ${a.role}</div><div class="seal">${a.tag}</div><h2>${a.name}</h2><h3>你的灵魂原型：${a.role}</h3><p class="quote">“${a.line}”</p><div class="sections"><article><b>性格特点</b><p>${a.desc}</p></article><article><b>为什么匹配</b><p>${a.reason}</p></article><article><b>你的隐藏优势</b><p>${a.adv}</p></article><article><b>趣味彩蛋</b><p>${a.egg}</p></article></div><p class="muted">纯属趣味测试，请把结果当作一面轻松的小镜子。</p><button class="btn" onclick="start()">再测一次</button>　<button class="btn" onclick="share()">分享结果</button>`}function share(){if(navigator.share)navigator.share({title:'我的历史人物灵魂画像',text:result.innerText});else{navigator.clipboard?.writeText(result.innerText);alert('结果文案已复制，快去分享吧！')}}
